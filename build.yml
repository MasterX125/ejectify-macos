name: Build Ejectify

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Build Ejectify
        run: |
          xcodebuild \
            -project ./Ejectify.xcodeproj \
            -scheme Ejectify \
            -configuration Release \
            -derivedDataPath ./build \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate Ejectify.app
        run: |
          find ./build -type d -name "Ejectify.app" -print

      - name: Package application
        run: |
          APP_PATH=$(find ./build -type d -name "Ejectify.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Ejectify.app was not found!"
            exit 1
          fi

          mkdir -p ./artifact

          ditto "$APP_PATH" "./artifact/Ejectify.app"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "./artifact/Ejectify.app" \
            "./artifact/Ejectify.zip"

      - name: Upload Ejectify
        uses: actions/upload-artifact@v4
        with:
          name: Ejectify-macOS-arm64
          path: ./artifact/Ejectify.zip
